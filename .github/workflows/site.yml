name: website
# Fetches fresh prices, runs the analysis notebook, publishes frontend/ to GitHub Pages,
# then checks the live site in a real browser.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5" # weekdays 22:30 UTC, after the US close (HK closes earlier)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-analysis.txt
      - name: Fetch market data
        working-directory: backend
        run: python -m app.pipeline.ingest --period 5y
      - name: Export JSON for the site
        working-directory: backend
        run: python -m app.export_site
      - name: Run the analysis notebooks and render them as site pages
        run: |
          jupyter nbconvert --to notebook --execute analysis/*.ipynb --output-dir build/notebooks --ExecutePreprocessor.timeout=600
          python scripts/render_notebooks.py build/notebooks frontend/analysis
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Check the live site
        run: python scripts/check_site.py "${{ needs.deploy.outputs.url }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: screenshots
