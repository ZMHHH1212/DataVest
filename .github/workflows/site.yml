name: website
# Fetches fresh prices, exports them as JSON and publishes frontend/ to GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5" # weekdays 22:30 UTC, after the US close (HK closes earlier)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Fetch market data
        working-directory: backend
        run: python -m app.pipeline.ingest --period 5y
      - name: Export JSON for the site
        working-directory: backend
        run: python -m app.export_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
